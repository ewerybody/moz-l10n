[project]
name = "monorepo"
version = "0.0.0"
description = "Mozilla tools for localization"

[dependency-groups]
dev = [
  "jsonschema>=4.23.0",
  "mypy>=1.11.2",
  "pydoc-markdown>=4.8.2",
  "pytest>=8.3.3",
  "ruff>=0.9.10",
  "types-lxml>=2024.9.16",
  "types-polib>=1.2.0.20240811",
  "zensical>=0.0.2",
]

[tool.uv.workspace]
members = ["python"]

[tool.mypy]
exclude = "/(build|tests)/"
explicit_package_bases = true
mypy_path = "python"
strict = true

[[tool.mypy.overrides]]
module = "translate.storage.properties"
ignore_missing_imports = true

[tool.ruff.lint]
allowed-confusables = [" "]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "PLC", # pylint conventions
  "PLE", # pyline errors
  "RUF", # ruff-specific rules
]
ignore = [
  "E501", # Line too long
]

[[tool.pydoc-markdown.loaders]]
type = "python"
search_path = [ "python" ]
packages = [ "moz.l10n" ]

[tool.pydoc-markdown.renderer]
type = "mkdocs"
output_directory = "api-docs"
content_directory_name = "docs"
